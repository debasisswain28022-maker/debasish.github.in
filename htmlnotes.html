<!DOCTYPE html>
<html>
<head>
  <title>About HTML</title>
  <style>
    body {
      background-color: #e0f7fa; /* Light blue background */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    img.top-image {
      width: 20%; /* Makes image span the full width of the page */
      height: auto; /* Maintains the aspect ratio */
      display: block;
      margin-bottom: 10px;
    }

    h1 {
      color: #00796b;
    }


    nav {
      background-color: #444;
      padding: 10px;
      text-align: center;
    }

     nav a {
      color: blue; /* Change to any color you want */
      text-decoration: none; /* Optional: removes underline */
      font-weight: bold;     /* Optional: makes the text bold */
    }
    .back-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: #00796b;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .back-button:hover {
      background-color: #6f079c;
    }

  </style>
</head>
<body>
  <!-- Back Button -->
  <a href="index.html" class="back-button">Back</a>

  <!-- Replace 'your-image.jpg' with the actual path or URL -->
  <img src="html.jpg" alt="Top Image" class="top-image">

  <h1>HTML</h1>

  <p>HTML is the standard markup language for Web pages.</p>
  <p>With HTML you can create your own Website.</p>
  <p>HTML is easy to learn - You will enjoy it!</p>

  <nav>
        <a href=htmlintro.html>What is of HTML ?</a>
      
    </nav>

</body>
</html>
